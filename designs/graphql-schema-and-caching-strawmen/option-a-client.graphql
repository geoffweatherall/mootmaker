# ═════════════════════════════════════════════════════════════════════════════
# OPTION A — what the webapp actually sends
#
# Invocation counts assume selection-aware resolvers: a sub-field that is not
# selected is not fetched, and `room { id }` / `attendees { id }` cost NO
# DynamoDB lookup because those ids are already on the stored meeting.
# ═════════════════════════════════════════════════════════════════════════════


# ─── 1. PAGE LOAD ────────────────────────────────────────────────────────────
# One request. One Lambda invocation. Replaces today's three sequential steps
# (Cognito claims -> MyPerson -> ListMeetings), which could not overlap because
# the meetings filter needed the person id.
#
# `people` and `rooms` are fetched in full ONCE here. They are small (10 rooms,
# tens of people) and slow-moving, and having them cached is what lets every
# later query ask for ids only.

query PageLoad($dates: DateRange!) {          # { from: today, to: today+3 }
  workspace(dates: $dates) {
    me { id name dateFormat timeFormat }
    rooms { id name capacity }
    people { id name }
    boundaries { earliestRetainedDate latestBookableDate }
    days {
      date
      meetings {
        id subject startTime endTime
        room { id }                            # id only - no room lookup
        organiser { id }                       # id only - no person lookup
        attendees { id }                       # id only - no person lookup
      }
    }
  }
}

# Names are resolved client-side from `rooms`/`people` in the same result.
# Apollo normalises them as Room:<id> / Person:<id>, so a component can also
# read one directly with useFragment rather than threading a lookup map down.


# ─── 2. CALENDAR: user pages back a week ─────────────────────────────────────
# Only the new days. `people`, `rooms`, `me` and `boundaries` are NOT selected,
# so the resolver does not fetch them - that is the whole point of
# selection-aware resolving. One invocation, one small response.
#
# The client asks only for days it does not already hold: Day is normalised on
# `date`, so a week already in the cache is simply left out of $dates. If the
# whole range is cached the query is skipped entirely and the render is free.
#
# Back-navigation stops at boundaries.earliestRetainedDate, read at page load.
# The client never computes that date itself.

query CalendarWeeks($dates: DateRange!) {
  workspace(dates: $dates) {
    days {
      date
      meetings {
        id subject startTime endTime
        room { id } organiser { id } attendees { id }
      }
    }
  }
}


# ─── 3. ROOM AVAILABILITY: move to another day ───────────────────────────────
# Structurally identical to #2 with a one-day range - which is the point. There
# is one way to ask for meetings, and every screen is a different range of it.
# Moving to an already-visited day is served entirely from cache.

query OneDay($dates: DateRange!) {            # { from: "2026-09-15", to: "2026-09-16" }
  workspace(dates: $dates) {
    days {
      date
      meetings {
        id subject startTime endTime
        room { id } organiser { id } attendees { id }
      }
    }
  }
}


# ─── 4. ADD MEETING PAGE ─────────────────────────────────────────────────────
# No query at all.
#
# The form needs rooms (name + capacity) and people (name). Both were fetched
# at page load and neither has changed, so opening the page costs nothing. This
# is the strongest argument for fetching them eagerly: it converts a two-query
# page into a zero-query one.
#
# If a session is long enough that staleness matters, this is the query - but
# it is a refresh, not a prerequisite, so the form renders immediately from
# cache while it runs.

query ReferenceDataRefresh {
  workspace(dates: { from: "1970-01-01", to: "1970-01-01" }) {   # empty range
    rooms { id name capacity }
    people { id name }
  }
}

# The empty range is awkward, and is Option A's clearest wart: `dates` is
# required by a field that here is being asked for something unrelated to
# dates. Option B has no equivalent - it just asks for `rooms` and `people`.


# ─── 5. SUGGEST A ROOM (on demand, inside Add Meeting) ───────────────────────
# Not modelled as part of the workspace: it is a user action with its own
# arguments, not part of a screen's initial state.

query SuggestRoom($startTime: String!, $endTime: String!, $requiredCapacity: Int!) {
  suggestRoom(startTime: $startTime, endTime: $endTime, requiredCapacity: $requiredCapacity) {
    id
  }
}


# ─── 6. CREATE A MEETING — the cache-update payload ──────────────────────────
# This is the shape worth looking at hardest.
#
# `day` is the WHOLE affected day after the write. Because Day is normalised on
# `date`, Apollo merges it straight over the cached Day:<date> - with NO update
# function, NO refetchQueries, and no client code that has to know a meeting
# belongs to a day. The mutation is self-sufficient.
#
# It also removes the read-after-write hazard entirely: the response IS the new
# state, so nothing is re-read. The router-state workaround in AddMeetingPage
# and the paired createdMeeting merge in RoomAvailabilityPage both disappear.
#
# And it is usually not extra data. AddMeetingPage navigates to the room
# availability view FOR THAT DATE on success - which needs exactly this day.
# Returning it is the next screen's query arriving early, not overhead.

mutation CreateMeeting($meeting: MeetingInput!) {
  createMeeting(meeting: $meeting) {
    errors
    meeting { id }
    day {
      date
      meetings {
        id subject startTime endTime
        room { id } organiser { id } attendees { id }
      }
    }
  }
}

# When the day is NOT wanted - a background or bulk caller with nowhere to
# navigate - the client simply does not select it, and the resolver does not
# build it. Same mutation, two costs, chosen by the caller:
#
#   mutation { createMeeting(meeting: $m) { errors meeting { id } } }


# ─── 7. BULK CREATE (mootmaker-demo-data) ────────────────────────────────────
# One call per seeded day instead of one per meeting. Returns the finished day,
# so a client watching that date is correct immediately.

mutation CreateMeetings($date: String!, $meetings: [MeetingInput!]!) {
  createMeetings(date: $date, meetings: $meetings) {
    failures { index errors }
    day { date meetings { id startTime endTime room { id } } }
  }
}


# ─── 8. ADMIN: create a room ─────────────────────────────────────────────────
# Returns the whole `rooms` collection, not just the new room.
#
# IMPORTANT, and different from the Day case above. Apollo auto-merges
# ENTITIES: returning a Room updates Room:<id> everywhere it is referenced, and
# returning a Day replaces Day:<date> INCLUDING its meetings list, because that
# list is a field on a normalised entity. Neither is true of a bare list. A
# `rooms` array in a mutation result normalises its members but does NOT append
# them to ROOT_QUERY.rooms, which is a different cache field entirely.
#
# So this one still needs an update function - but a trivial one, because every
# byte it needs is already in the response:
#
#   update(cache, { data }) {
#     cache.writeQuery({ query: ROOMS, data: { rooms: data.createRoom.rooms } })
#   }
#
# That is strictly better than today's SettingsPage, which merges a single item
# into the cached list AND fires a refetch because the merge alone is not
# sufficient. Here there is no refetch and no merge logic - the server's list is
# authoritative and replaces the cached one wholesale. Ten rooms is nothing to
# send.
#
# Only `createMeeting`/`createMeetings` are genuinely update-function-free, and
# only because Day is an entity.

mutation CreateRoom($room: RoomInput!) {
  createRoom(room: $room) {
    errors
    rooms { id name capacity }
  }
}

mutation CreatePerson($person: PersonInput!) {
  createPerson(person: $person) {
    errors
    people { id name }
  }
}
